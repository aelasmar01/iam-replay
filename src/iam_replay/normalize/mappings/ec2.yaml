# ec2 event -> IAM action mappings.
#
# The largest event surface in the allowlist, and the one with the most
# expensive mapping in the set (RunInstances, below).
#
# Every ec2:Describe* action is account-wide: EC2 supports no resource-level
# permissions for them at all. "*" here is the documented scope, not a widening
# fallback -- a policy author literally cannot scope these to a resource.
service: ec2

events:
  # --- describes: account-wide by AWS's own definition ---
  DescribeInstances:
    action: ec2:DescribeInstances
    resource: "*"
  DescribeInstanceStatus:
    action: ec2:DescribeInstanceStatus
    resource: "*"
  DescribeInstanceTypes:
    action: ec2:DescribeInstanceTypes
    resource: "*"
  DescribeSecurityGroups:
    action: ec2:DescribeSecurityGroups
    resource: "*"
  DescribeVpcs:
    action: ec2:DescribeVpcs
    resource: "*"
  DescribeSubnets:
    action: ec2:DescribeSubnets
    resource: "*"
  DescribeRouteTables:
    action: ec2:DescribeRouteTables
    resource: "*"
  DescribeNetworkInterfaces:
    action: ec2:DescribeNetworkInterfaces
    resource: "*"
  DescribeImages:
    action: ec2:DescribeImages
    resource: "*"
  DescribeVolumes:
    action: ec2:DescribeVolumes
    resource: "*"
  DescribeSnapshots:
    action: ec2:DescribeSnapshots
    resource: "*"
  DescribeTags:
    action: ec2:DescribeTags
    resource: "*"
  DescribeAvailabilityZones:
    action: ec2:DescribeAvailabilityZones
    resource: "*"
  DescribeRegions:
    action: ec2:DescribeRegions
    resource: "*"
  DescribeKeyPairs:
    action: ec2:DescribeKeyPairs
    resource: "*"
  DescribeAddresses:
    action: ec2:DescribeAddresses
    resource: "*"
  DescribeAccountAttributes:
    action: ec2:DescribeAccountAttributes
    resource: "*"
  DescribeLaunchTemplates:
    action: ec2:DescribeLaunchTemplates
    resource: "*"

  # --- RunInstances: the multi-permission expansion ---
  #
  # A single RunInstances call authorizes against the instance being created and
  # every resource it references: the AMI, the subnet, the security groups, the
  # volumes, the key pair, the network interface. IAM evaluates all of them.
  # None of the created resources' IDs exist in requestParameters (they are
  # generated by the call), so those entries resolve to UNKNOWN_RESOURCE rather
  # than to a guessed ARN -- an honest answer that the report surfaces.
  #
  # Every entry is marked INFERRED: the event states that RunInstances happened,
  # not that these seven authorizations occurred.
  RunInstances:
    expands_to:
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:instance/*"
        note: >-
          the instance ID is generated by this call and is not present in
          requestParameters, so this entry cannot be scoped further
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}::image/{requestParameters.instancesSet.items.0.imageId}"
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:subnet/{requestParameters.subnetId}"
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:key-pair/{requestParameters.instancesSet.items.0.keyName}"
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.instancesSet.items.0.groupSet.items.0.groupId}"
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:volume/*"
        note: >-
          root and attached volume IDs are generated by this call
      - action: ec2:RunInstances
        resource: "arn:{partition}:ec2:{region}:{account}:network-interface/*"
        note: >-
          the primary network interface ID is generated by this call
      - action: iam:PassRole
        resource_may_be_arn: true
        resource: "{requestParameters.iamInstanceProfile.arn}"
        note: >-
          required only when an instance profile is attached, and never logged
          as its own event; resolves to UNKNOWN_RESOURCE when no profile was
          passed, which is the correct answer rather than a skipped permission

  # --- instance lifecycle ---
  #
  # Instance IDs arrive nested under instancesSet.items[]. Only the first is
  # templated: a multi-instance call authorizes against each one, and mapping
  # only the first would understate the blast radius. resources[] is preferred
  # where CloudTrail populates it.
  TerminateInstances:
    action: ec2:TerminateInstances
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.instancesSet.items.0.instanceId}"
  StartInstances:
    action: ec2:StartInstances
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.instancesSet.items.0.instanceId}"
  StopInstances:
    action: ec2:StopInstances
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.instancesSet.items.0.instanceId}"
  RebootInstances:
    action: ec2:RebootInstances
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.instancesSet.items.0.instanceId}"
  ModifyInstanceAttribute:
    action: ec2:ModifyInstanceAttribute
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.instanceId}"

  # --- security groups ---
  # Authorizes against both the group being created and the VPC it goes into,
  # so it expands and every entry is marked INFERRED. The group ID is generated
  # by the call and is not in requestParameters, so that entry cannot be scoped
  # further than security-group/*.
  CreateSecurityGroup:
    expands_to:
      - action: ec2:CreateSecurityGroup
        resource: "arn:{partition}:ec2:{region}:{account}:security-group/*"
      - action: ec2:CreateSecurityGroup
        resource: "arn:{partition}:ec2:{region}:{account}:vpc/{requestParameters.vpcId}"
  DeleteSecurityGroup:
    action: ec2:DeleteSecurityGroup
    resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.groupId}"
  AuthorizeSecurityGroupIngress:
    action: ec2:AuthorizeSecurityGroupIngress
    resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.groupId}"
  AuthorizeSecurityGroupEgress:
    action: ec2:AuthorizeSecurityGroupEgress
    resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.groupId}"
  RevokeSecurityGroupIngress:
    action: ec2:RevokeSecurityGroupIngress
    resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.groupId}"
  RevokeSecurityGroupEgress:
    action: ec2:RevokeSecurityGroupEgress
    resource: "arn:{partition}:ec2:{region}:{account}:security-group/{requestParameters.groupId}"

  # --- volumes and tags ---
  CreateVolume:
    action: ec2:CreateVolume
    resource: "arn:{partition}:ec2:{region}:{account}:volume/*"
  DeleteVolume:
    action: ec2:DeleteVolume
    resource: "arn:{partition}:ec2:{region}:{account}:volume/{requestParameters.volumeId}"
  AttachVolume:
    action: ec2:AttachVolume
    resource: "arn:{partition}:ec2:{region}:{account}:volume/{requestParameters.volumeId}"
  CreateTags:
    action: ec2:CreateTags
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.resourcesSet.items.0.resourceId}"
  DeleteTags:
    action: ec2:DeleteTags
    resource_type: AWS::EC2::Instance
    resource: "arn:{partition}:ec2:{region}:{account}:instance/{requestParameters.resourcesSet.items.0.resourceId}"
