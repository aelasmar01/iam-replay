[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-replay"
version = "0.1.0"
description = "Replay a principal's historical CloudTrail activity against a candidate IAM policy and report exactly which calls would now be denied."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ali El-Asmar" }]
keywords = ["aws", "iam", "cloudtrail", "policy", "least-privilege", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/aelasmar01/iam-replay"
Repository = "https://github.com/aelasmar01/iam-replay"

[project.scripts]
iam-replay = "iam_replay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
